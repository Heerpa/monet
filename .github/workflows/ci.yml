name: CI
on:
  push:
    branches: [master, main, develop]
  pull_request:
jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # needed for setuptools-scm
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}", cache: pip }
      - run: python -m pip install --upgrade pip
      # [server] brings FastAPI (test_server/dashboard/io_http); pyserial is a
      # [hardware] dep imported eagerly by monet.attenuation (test_attenuation/
      # laser/util). Both are needed to collect the suite; the rest of
      # [hardware] (git/URL SDK deps) is not, so keep CI wheel-only and lean.
      - run: pip install -e .[dev,server] pyserial
      - run: black --check --line-length 79 monet
      - run: flake8 monet
      - run: pytest -q

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monet"
version = "0.3.4"
description = "A Python based software suite to calibrate laser power for microscopy systems."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
authors = [
    { name = "Heinrich Grabmayr", email = "hgrabmayr@biochem.mpg.de" },
]
keywords = ["laser", "power", "calibration", "microscopy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

# Core runtime dependencies: everything imported eagerly by the package and
# needed to run calibrations/analysis against the simulated `Test*` hardware.
dependencies = [
    "numpy>=1.23",
    "pandas>=2.3",
    "lmfit>=1.3",
    "matplotlib>=3.10",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "icecream>=2.1",
    "requests>=2.31",
    "importlib_resources>=5.0",
]

[project.optional-dependencies]
# PyQt5 GUI and the embeddable `monet.qt` widgets.
gui = [
    "PyQt5>=5.15",
]

# SQLite + FastAPI calibration server (`python -m monet serve`).
server = [
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "sqlalchemy>=2.0",
]

# Real-hardware SDKs. All imported lazily, so they are only required on the
# machines that actually drive the instruments. msl-equipment and pycobolt have
# no PyPI release and are pulled directly from their published artifacts.
# (ThorlabsTLPMPowerMeter additionally needs Thorlabs' TLPM.py wrapper, vendored
# as monet/TLPM.py — it ships with the Optical Power Monitor SDK, not via pip.)
hardware = [
    "pyvisa>=1.15",
    "ThorlabsPM100>=1.2.2",
    "pyserial>=3.5",
    "microscope>=0.7",
    "nidaqmx>=1.2",
    "pycromanager",
    "pycobolt @ git+https://github.com/cobolt-lasers/pycobolt.git",
    "msl-equipment @ https://github.com/MSLNZ/msl-equipment/releases/download/v0.2.0/msl_equipment-0.2.0-py3-none-any.whl",
]

# Test / development tooling.
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "coverage>=7.10",
    "httpx>=0.25",
]

# Convenience aggregate of every optional group.
all = [
    "monet[gui]",
    "monet[server]",
    "monet[hardware]",
    "monet[dev]",
]

[project.urls]
Homepage = "https://github.com/Heerpa/monet"
Repository = "https://github.com/Heerpa/monet"

[project.scripts]
monet = "monet.__main__:main"

[tool.setuptools.packages.find]
include = ["monet*"]

[tool.setuptools.package-data]
# Vendored Thorlabs TLPM wrapper, when present alongside the package.
monet = ["TLPM.py"]

[tool.pytest.ini_options]
testpaths = ["monet/tests"]
addopts = "--cov=monet"

[tool.coverage.run]
source = ["monet"]
omit = ["monet/tests/*"]
